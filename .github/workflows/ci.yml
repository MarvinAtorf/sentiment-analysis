name: CI

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/**"

# Required permissions to allow the GITHUB_TOKEN to create issues
permissions:
    contents: read
    issues: write

jobs:
  run-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull the main branch to the VM
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the predict script
        run: |
          python src/predict.py

      - name: Create Issue on Failure
        if: failure() && github.event_name == 'push'  # Triggers only on push failures, ignores PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Format Failure: ${{ github.workflow }} (#${{ github.run_number }})" \
            --body "The format script failed on run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Triggered by push from: @${{ github.actor }}." \
            --label "bug"