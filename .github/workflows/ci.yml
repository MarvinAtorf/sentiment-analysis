name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  sentiment-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training
        run: |
          python src/train.py

      - name: Run prediction
        run: |
          python src/predection.py "I love this product"